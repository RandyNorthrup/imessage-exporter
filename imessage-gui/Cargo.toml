[package]
name = "imessage-gui"
description = "A native desktop GUI for browsing, previewing, and exporting iMessage data"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ReagentX/imessage-exporter"
version = "0.0.0"

[[bin]]
name = "imessage-gui"
path = "src/main.rs"

[dependencies]
# `egui` is consumed via `eframe::egui` to guarantee a single, matching version
eframe = { version = "0.29", default-features = true }
rfd = "0.15"
open = "5"
chrono = "=0.4.44"
plist = "=1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imessage-database = { path = "../imessage-database" }
imessage-exporter = { path = "../imessage-exporter" }

# The embedded HTML preview uses the system webview, which composes with the
# winit-based window only on macOS and Windows. Other platforms fall back to the
# egui bubble preview and "Open in browser", so they don't depend on `wry`
# (which on Linux would otherwise require WebKitGTK development libraries).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.55.1"
